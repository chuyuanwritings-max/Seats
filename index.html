    if(h.skills)add('li','会：'+h.skills.map(k=>SKILLNAME[k]).join('、'),!S?'wait':h.skills.includes(S.kind)?'ok':'bad');
    if(L.coupleAdj){const sp=PEOPLE[pid].spouse;if(sp&&cast.has(sp)){const ss=seatOf[sp];add('li','和'+PEOPLE[sp].title+'挨着',(!S||!ss)?'wait':G.adj[s].has(ss)?'ok':'bad',[sp]);}}
    // wants

        let r='ok';const k=ru[0];

        else if(k==='NEXT_TO'){who.push(ru[1]);const b=seatOf[ru[1]];if(!cast.has(ru[1]))r='ok';else if(!b)r='wait';else r=G.adj[s].has(b)?'ok':'bad';}

function panel(html){overlay.style.pointerEvents='auto';overlay.style.background='rgba(42,39,36,.55)';overlay.innerHTML='<div class="panel" role="dialog">'+html+'</div>';return overlay.firstChild;}

function showMenu(){

  p.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{audioOn();SND.tick();closePanel();startLevel(+b.dataset.i);}));
  p.querySelector('#albumBtn').addEventListener('click',()=>{audioOn();showAlbum();});
}
function showRule(next){

function miniScene(Lv,snap){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','10 44 340 312');s.setAttribute('role','img');s.setAttribute('aria-label',Lv.title);
  const g=E('g',null,s);const G2=buildGeo(Lv);drawScene(g,Lv,true);
  for(const p in snap){const sl=G2.byId[snap[p]];if(!sl)continue;const f=E('g',{transform:'translate('+sl.x+' '+sl.y+')'},g);const pose=(sl.kind==='stand'||Lv.scene==='kitchen')?'stand':'seat';drawFigure(f,p,pose,'happy');}

function showAlbum(){
  const p=panel('<h1>相册</h1><p class="sub">每过一关，留一张。</p><div class="album" id="alb"></div><div class="row"><button class="btn" id="bk">回目录</button></div>');
  const alb=p.querySelector('#alb');
  LEVELS.forEach(lv=>{const fig=document.createElement('figure');if(SAVE.album[lv.id]){fig.appendChild(miniScene(lv,SAVE.album[lv.id]));}else{const d=document.createElement('div');d.className='empty';d.textContent='还没拍';fig.appendChild(d);}const cap=document.createElement('figcaption');cap.textContent=lv.title;fig.appendChild(cap);alb.appendChild(fig);});
  p.querySelector('#bk').addEventListener('click',()=>{SND.tick();showMenu();});
}
function showResult(){
  const nextI=levelIdx+1<LEVELS.length?levelIdx+1:null;
  const p=panel('<span class="tag">过关</span><h1 style="margin-top:8px">'+L.title+'</h1><div class="album" style="grid-template-columns:1fr"><figure id="ph"></figure></div><div class="row">'+(nextI!==null?'<button class="btn red" id="nx">下一关</button>':'')+'<button class="btn" id="again">再来一次</button><button class="btn" id="menu">目录</button></div>'+(nextI===null?'<p class="foot">试玩版就到这里。哪里好玩、哪里卡住，告诉 Kira。</p>':''));
  const fig=p.querySelector('#ph');fig.appendChild(miniScene(L,SAVE.album[L.id]));const cap=document.createElement('figcaption');cap.textContent='已收进相册';fig.appendChild(cap);

}
