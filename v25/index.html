function buildGeo(L){
  const adj={},byId={};L.slots.forEach(s=>{adj[s.id]=new Set();byId[s.id]=s;});
  L.links.forEach(([a,b])=>{adj[a].add(b);adj[b].add(a);});
  return {adj,byId,opp:L.opp||{}};
}
// 每站在场的人和卡片
function castAt(L,k){
  const m=new Map();
  for(let i=0;i<=k;i++){const S=L.stations[i];(S.leave||[]).forEach(id=>m.delete(id));
    if(S.set)for(const id in S.set){if(m.has(id))m.set(id,Object.assign({},m.get(id),{card:S.set[id]}));}
    (S.arrive||[]).forEach(c=>m.set(c.id,Object.assign({},c)));}
  return m;
}
function evaluate(L,G,cast,seat){
  const occ={};for(const p in seat)if(cast.has(p))occ[seat[p]]=p;
  const per={};let happy=0,total=0,allSeated=true;
  for(const [pid,c] of cast){
    total++;const s=seat[pid];const S=s?G.byId[s]:null;const checks=[];
    for(const line of c.card){
      let st='ok';const who=[];let info=false;
      for(const ru of line.r){
        const k=ru[0];let r='ok';
        if(k==='AURA'){info=true;continue;}
        if(!S){r='wait';}
        else if(k==='AT_TAG')r=S.tags.includes(ru[1])?'ok':'bad';
        else if(k==='AWAY_TAG')r=S.tags.includes(ru[1])?'bad':'ok';
        else if(k==='NEXT_TO'){who.push(ru[1]);if(!cast.has(ru[1]))r='ok';else{const b=seat[ru[1]];r=!b?'wait':(G.adj[s].has(b)?'ok':'bad');}}
        else if(k==='NOT_NEXT_TO'){who.push(ru[1]);const b=seat[ru[1]];r=(b&&cast.has(ru[1])&&G.adj[s].has(b))?'bad':'ok';}
        else if(k==='NOT_OPP'){who.push(ru[1]);const b=seat[ru[1]];r=(b&&cast.has(ru[1])&&G.opp[s]===b)?'bad':'ok';}
        else if(k==='AVOID'){for(const n of G.adj[s]){const q=occ[n];if(q&&cast.get(q).aura===ru[1]){r='bad';who.push(q);}}}
        else if(k==='ALONE'){for(const n of G.adj[s])if(occ[n]){r='bad';who.push(occ[n]);}}
        if(r==='bad')st='bad';else if(r==='wait'&&st!=='bad')st='wait';
      }
      checks.push({t:line.t,st:info?'info':st,who,r:line.r});
    }
    let state='idle';
    if(S){state='happy';if(checks.some(x=>x.st==='bad'))state='upset';else if(checks.some(x=>x.st==='wait'))state='calm';}
    else allSeated=false;
    if(state==='happy')happy++;
    per[pid]={state,checks};
  }
  return {per,happy,total,canConfirm:allSeated,perfect:allSeated&&happy===total};
}
// 求解：这一站所有人都满意的坐法有几种（不受上一站影响）。边放边查。
function solve(L,k,cap){
  cap=cap||1e7;const G=buildGeo(L);const cast=castAt(L,k);const ids=[...cast.keys()];
  const sids=L.slots.map(s=>s.id);
  const statOK=(c,sid)=>{const S=G.byId[sid];for(const l of c.card)for(const ru of l.r){if(ru[0]==='AT_TAG'&&!S.tags.includes(ru[1]))return false;if(ru[0]==='AWAY_TAG'&&S.tags.includes(ru[1]))return false;}return true;};
  const cand={};ids.forEach(p=>cand[p]=sids.filter(s=>statOK(cast.get(p),s)));
  ids.sort((a,b)=>cand[a].length-cand[b].length);
  const seat={},occ={};let n=0;
  const violated=(p)=>{const c=cast.get(p),s=seat[p];
    for(const l of c.card)for(const ru of l.r){const k=ru[0];
      if(k==='NEXT_TO'&&cast.has(ru[1])&&seat[ru[1]]&&!G.adj[s].has(seat[ru[1]]))return true;
      if(k==='NOT_NEXT_TO'&&seat[ru[1]]&&G.adj[s].has(seat[ru[1]]))return true;
      if(k==='NOT_OPP'&&seat[ru[1]]&&G.opp[s]===seat[ru[1]])return true;
      if(k==='AVOID'){for(const nb of G.adj[s]){const q=occ[nb];if(q&&cast.get(q).aura===ru[1])return true;}}
      if(k==='ALONE'){for(const nb of G.adj[s])if(occ[nb])return true;}
    }return false;};
  (function rec(i){
    if(n>=cap)return;
    if(i===ids.length){n++;return;}
    const p=ids[i];
    for(const sid of cand[p]){if(occ[sid])continue;seat[p]=sid;occ[sid]=p;
      let bad=false;for(const q in seat){if(violated(q)){bad=true;break;}}
      if(!bad)rec(i+1);
      delete occ[sid];delete seat[p];if(n>=cap)return;}
  })(0);
  return n;
}
