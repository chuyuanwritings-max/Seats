function buildGeo(L){
  const adj={},byId={};L.slots.forEach(s=>{adj[s.id]=new Set();byId[s.id]=s;});
  L.links.forEach(([a,b])=>{adj[a].add(b);adj[b].add(a);});
  return {adj,byId,opp:L.opp||{}};
}
// 每站在场的人和卡片
function castAt(L,k){
  const m=new Map();
  for(let i=0;i<=k;i++){const S=L.stations[i];(S.leave||[]).forEach(id=>m.delete(id));
    if(S.set)for(const id in S.set){if(m.has(id))m.set(id,Object.assign({},m.get(id),{card:S.set[id]}));}
    (S.arrive||[]).forEach(c=>m.set(c.id,Object.assign({},c)));}
  return m;
}
function evaluate(L,G,cast,seat){
  const occ={};for(const p in seat)if(cast.has(p))occ[seat[p]]=p;
  const per={};let happy=0,total=0,allSeated=true;
  for(const [pid,c] of cast){
    total++;const s=seat[pid];const S=s?G.byId[s]:null;const checks=[];
    for(const line of c.card){
      let st='ok';const who=[];let info=false;
      for(const ru of line.r){
        const k=ru[0];let r='ok';
        if(k==='AURA'){info=true;continue;}
        if(!S){r='wait';}
        else if(k==='AT_TAG')r=S.tags.includes(ru[1])?'ok':'bad';
        else if(k==='AWAY_TAG')r=S.tags.includes(ru[1])?'bad':'ok';
        else if(k==='NEXT_TO'){who.push(ru[1]);if(!cast.has(ru[1]))r='ok';else{const b=seat[ru[1]];r=!b?'wait':(G.adj[s].has(b)?'ok':'bad');}}
        else if(k==='NOT_NEXT_TO'){who.push(ru[1]);const b=seat[ru[1]];r=(b&&cast.has(ru[1])&&G.adj[s].has(b))?'bad':'ok';}
        else if(k==='NOT_OPP'){who.push(ru[1]);const b=seat[ru[1]];r=(b&&cast.has(ru[1])&&G.opp[s]===b)?'bad':'ok';}
        else if(k==='AVOID'){for(const n of G.adj[s]){const q=occ[n];if(q&&cast.get(q).aura===ru[1]){r='bad';who.push(q);}}}
        else if(k==='ALONE'){for(const n of G.adj[s])if(occ[n]){r='bad';who.push(occ[n]);}}
        if(r==='bad')st='bad';else if(r==='wait'&&st!=='bad')st='wait';
      }
      checks.push({t:line.t,st:info?'info':st,who,r:line.r});
    }
    let state='idle';
    if(S){state='happy';if(checks.some(x=>x.st==='bad'))state='upset';else if(checks.some(x=>x.st==='wait'))state='calm';}
    else allSeated=false;
    if(state==='happy')happy++;
    per[pid]={state,checks};
  }
  return {per,happy,total,canConfirm:allSeated,perfect:allSeated&&happy===total};
}
// 求解：这一站所有人都满意的坐法有几种（不受上一站影响）。边放边查。
function solve(L,k,cap){
  cap=cap||1e7;const G=buildGeo(L);const cast=castAt(L,k);const ids=[...cast.keys()];
  const sids=L.slots.map(s=>s.id);
  const statOK=(c,sid)=>{const S=G.byId[sid];for(const l of c.card)for(const ru of l.r){if(ru[0]==='AT_TAG'&&!S.tags.includes(ru[1]))return false;if(ru[0]==='AWAY_TAG'&&S.tags.includes(ru[1]))return false;}return true;};
  const cand={};ids.forEach(p=>cand[p]=sids.filter(s=>statOK(cast.get(p),s)));
  ids.sort((a,b)=>cand[a].length-cand[b].length);
  const seat={},occ={};let n=0;
  const violated=(p)=>{const c=cast.get(p),s=seat[p];
    for(const l of c.card)for(const ru of l.r){const k=ru[0];
      if(k==='NEXT_TO'&&cast.has(ru[1])&&seat[ru[1]]&&!G.adj[s].has(seat[ru[1]]))return true;
      if(k==='NOT_NEXT_TO'&&seat[ru[1]]&&G.adj[s].has(seat[ru[1]]))return true;
      if(k==='NOT_OPP'&&seat[ru[1]]&&G.opp[s]===seat[ru[1]])return true;
      if(k==='AVOID'){for(const nb of G.adj[s]){const q=occ[nb];if(q&&cast.get(q).aura===ru[1])return true;}}
      if(k==='ALONE'){for(const nb of G.adj[s])if(occ[nb])return true;}
    }return false;};
  (function rec(i){
    if(n>=cap)return;
    if(i===ids.length){n++;return;}
    const p=ids[i];
    for(const sid of cand[p]){if(occ[sid])continue;seat[p]=sid;occ[sid]=p;
      let bad=false;for(const q in seat){if(violated(q)){bad=true;break;}}
      if(!bad)rec(i+1);
      delete occ[sid];delete seat[p];if(n>=cap)return;}
  })(0);
  return n;
}

/* ---------- 动画引擎（可整体加速）---------- */
let TS=1;const tweens=[];const fxs=new Set();
const EASE={lin:t=>t,in2:t=>t*t,out:t=>1-Math.pow(1-t,3),inout:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,back:t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}};
function tw(obj,props,dur,ease,delay,done){const t={obj,to:props,from:null,el:-(delay||0),dur:Math.max(1,dur),ease:EASE[ease||'out'],done};tweens.push(t);return t;}
function after(ms,fn){tweens.push({obj:null,el:-ms,dur:1,fn});}
const sleep=ms=>new Promise(r=>after(ms,r));
let last=performance.now();
function loop(now){const dt=Math.min(64,now-last)*TS*(SAVE.settings.fast?1.6:1);last=now;
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];t.el+=dt;if(t.el<0)continue;
    if(!t.obj){tweens.splice(i,1);t.fn&&t.fn();continue;}
    if(!t.from){t.from={};for(const k in t.to)t.from[k]=t.obj[k];}
    const p=clamp(t.el/t.dur,0,1),e=t.ease(p);for(const k in t.to)t.obj[k]=t.from[k]+(t.to[k]-t.from[k])*e;t.obj.dirty=true;
    if(p>=1){tweens.splice(i,1);t.done&&t.done();}}
  for(const f of fxs)f(now,dt);
  if(views)for(const v of views.values()){idle(v,now,dt);if(v.dirty){applyView(v);v.dirty=false;}}
  requestAnimationFrame(loop);}

  const draw=()=>{g.querySelectorAll('.row').forEach(r=>r.remove());keys.forEach(([k,lab],i)=>{const r=E('g',{class:'row hit',transform:'translate(60 '+(222+i*50)+')'},g);E('rect',{width:240,height:40,fill:'transparent'},r);E('text',{x:0,y:26,'font-size':16,fill:INK,class:'ui'},r,lab);
    const on=SAVE.settings[k];E('rect',{x:186,y:8,width:48,height:26,rx:13,fill:on?OK:SHADE,stroke:INK,'stroke-width':2},r);E('circle',{cx:on?220:200,cy:21,r:9,fill:CREAM,stroke:INK,'stroke-width':1.8},r);
    r.addEventListener('pointerdown',e=>{e.stopPropagation();SAVE.settings[k]=!SAVE.settings[k];writeSave();SND.btn();draw();});});};draw();
  const clr=E('g',{class:'hit row2',transform:'translate(60 376)'},g);E('rect',{width:240,height:30,fill:'transparent'},clr);const ct=E('text',{x:0,y:20,'font-size':14,fill:BAD,class:'ui'},clr,'清空存档');let armed=false;
  clr.addEventListener('pointerdown',e=>{e.stopPropagation();if(!armed){armed=true;ct.textContent='再点一次确认清空';return;}SAVE={levels:{},unlocked:1,album:{},settings:SAVE.settings};writeSave();ct.textContent='已清空';});
  button(g,80,412,200,44,'关闭',()=>{g.remove();back&&back();},true);}

  const saveG=G;G=buildGeo(Lv);const sh=drawScene(g,Lv,true);for(const p in data.seat){const o=slotOrigin(data.seat[p]);const f=E('g',{transform:'translate('+o.x+' '+o.y+') scale('+o.s+')'},g);drawFigure(f,p,o.pose,'happy');}G=saveG;return g;}

    const data=SAVE.album[id];if(data){const clip='clip'+id;const cp=E('clipPath',{id:clip},gDefs);E('rect',{x:x+10,y:y+10,width:280,height:180},cp);const holder=E('g',{'clip-path':'url(#'+clip+')'},f);E('rect',{x:x+10,y:y+10,width:280,height:180,fill:PAPER},holder);miniPhoto(holder,Lv,data,x+10+(280-280)/2,y+10,280);}
    else{E('rect',{x:x+10,y:y+10,width:280,height:180,fill:'none',stroke:SHADE,'stroke-width':2,'stroke-dasharray':'6 5'},f);E('text',{x:x+150,y:y+105,'text-anchor':'middle','font-size':13,fill:MUTE2,class:'ui'},f,'还没拍');}
    E('text',{x:x+150,y:y+210,'text-anchor':'middle','font-size':14,fill:INK,class:'kai'},f,Lv.title+(data?' · '+data.date:''));});
  const bk=E('g',{class:'hit',transform:'translate(34 610)'},g);E('rect',{x:-22,y:-22,width:44,height:44,fill:'transparent'},bk);E('path',{d:'M0-10V8M-8 0L0 10L8 0',fill:'none',stroke:INK,'stroke-width':3,'stroke-linecap':'round','stroke-linejoin':'round',transform:'rotate(90)'},bk);
  bk.addEventListener('pointerdown',e=>{e.stopPropagation();SND.btn();showTitle();});}
